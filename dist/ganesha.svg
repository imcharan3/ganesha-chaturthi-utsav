<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="35%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E80" />
      <stop offset="50%" stop-color="#FF6E40" />
      <stop offset="100%" stop-color="#D84315" />
    </linearGradient>
    <linearGradient id="sindoorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Aura Glow Circle -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="10 8" opacity="0.4" />
  <circle cx="250" cy="250" r="190" fill="#2d0f05" fill-opacity="0.3" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Sun Rays Radiance -->
  <g stroke="url(#goldGrad)" stroke-width="2" opacity="0.35">
    <line x1="250" y1="25" x2="250" y2="45" />
    <line x1="250" y1="455" x2="250" y2="475" />
    <line x1="25" y1="250" x2="45" y2="250" />
    <line x1="455" y1="250" x2="475" y2="250" />
    <line x1="91" y1="91" x2="105" y2="105" />
    <line x1="395" y1="395" x2="409" y2="409" />
    <line x1="91" y1="409" x2="105" y2="395" />
    <line x1="395" y1="105" x2="409" y2="91" />
  </g>

  <!-- Auspicious Crown (Mukut) -->
  <path d="M190 150 L250 80 L310 150 L285 170 L215 170 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="250" cy="80" r="9" fill="url(#sindoorGrad)" />
  <circle cx="250" cy="120" r="7" fill="url(#sindoorGrad)" />
  <path d="M210 160 Q250 145 290 160" stroke="#FFE082" stroke-width="3" fill="none" />

  <!-- Large Left Ear (Supakarna) -->
  <path d="M195 180 C110 150 90 260 165 290 C185 300 200 280 200 260" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" />

  <!-- Right Ear / Modak blessing hand curve -->
  <path d="M305 180 C365 160 380 240 335 285 C320 300 305 285 300 265" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Forehead & Head Oval -->
  <path d="M190 180 Q250 170 310 180 Q325 220 300 250 Q250 260 200 250 Z" fill="url(#saffronGrad)" opacity="0.9" />

  <!-- Auspicious Tilak (Tripundra & Sindoor Chandan) -->
  <path d="M220 185 Q250 190 280 185" stroke="#FFF9C4" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M225 195 Q250 200 275 195" stroke="#FFF9C4" stroke-width="4" stroke-linecap="round" fill="none" />
  <ellipse cx="250" cy="210" rx="6" ry="12" fill="url(#sindoorGrad)" />

  <!-- Divine Eye -->
  <ellipse cx="225" cy="225" rx="5" ry="3" fill="#FFF" />
  <circle cx="225" cy="225" r="2.5" fill="#3E2723" />
  <path d="M216 220 Q225 214 234 220" stroke="#FFD54F" stroke-width="2.5" fill="none" />

  <!-- Trunk (Vakratunda) in fluid graceful calligraphic curve -->
  <path d="M245 235 Q265 270 260 320 Q255 365 230 385 Q195 405 170 375 Q150 345 175 320 Q195 300 215 320 Q225 330 220 345" 
        fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Sacred Tusk (Ekadanta) -->
  <path d="M215 270 L190 285 L215 285 Z" fill="#FFFFFF" stroke="#FFE082" stroke-width="1.5" />

  <!-- Golden Modak / Laddu in hand -->
  <g transform="translate(340, 310)">
    <circle cx="0" cy="0" r="16" fill="url(#goldGrad)" filter="url(#glow)"/>
    <ellipse cx="-4" cy="-4" rx="4" ry="6" fill="#FFF9C4" opacity="0.8" />
    <!-- Auspicious Modak tip -->
    <path d="M-10 -5 Q0 -20 10 -5 Q0 15 -10 -5" fill="url(#goldGrad)" />
    <circle cx="0" cy="-6" r="3" fill="url(#sindoorGrad)" />
  </g>

  <!-- Diya at bottom center -->
  <g transform="translate(250, 425)">
    <!-- Base Diya -->
    <path d="M-30 0 Q0 20 30 0 Q20 -10 -20 -10 Z" fill="url(#goldGrad)" />
    <!-- Flame -->
    <path d="M0 -10 Q-10 -25 0 -40 Q10 -25 0 -10" fill="url(#saffronGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="-22" r="5" fill="#FFF9C4" />
  </g>

  <!-- Sacred Om Symbol subtly on the right -->
  <text x="350" y="140" font-family="'Noto Sans Telugu', serif" font-size="28" fill="url(#goldGrad)" opacity="0.6">ॐ</text>
</svg>
